name: ZonePort
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GCC_C_LANGUAGE_STANDARD: c11
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OBJC_BRIDGING_HEADER: Native/Zone-Bridging-Header.h
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ZONE_WITH_ENGINE"
    ZONE_ENGINE_BUILD_DIR: "$(SRCROOT)/Engine/Build-iOS"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/Native/include"
      - "$(SRCROOT)/Engine/Host"
      - "$(SRCROOT)/Engine/Generated"
      - "$(SRCROOT)/Tools/wabt/wasm2c"
      - "$(SRCROOT)/Tools/wabt/third_party/simde"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - ZONE_WITH_ENGINE=1
      - ZONE_NATIVE_GLES=1
      - _DARWIN_C_SOURCE=1
      - WASM_RT_MEMCHECK_BOUNDS_CHECK=1
      - WASM_RT_SKIP_SIGNAL_RECOVERY=1
      - WASM_RT_MAX_CALL_STACK_DEPTH=4096
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "$(ZONE_ENGINE_BUILD_DIR)/libzone_native_host.a"
      - "$(ZONE_ENGINE_BUILD_DIR)/libxray_aot.a"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ZonePort:
    type: application
    platform: iOS
    sources:
      - App
      - Native
      - path: Resources/ZoneBackdrop.jpg
        buildPhase: resources
      - path: Engine/SupportData
        type: folder
        buildPhase: resources
      - path: Engine/Mobile
        type: folder
        buildPhase: resources
      - path: Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGLES.framework
      - sdk: OpenAL.framework
      - sdk: GameController.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lupc9102.zoneport
        PRODUCT_NAME: ZonePort
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ZonePort:
    build:
      targets:
        ZonePort: all
