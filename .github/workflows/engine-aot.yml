name: Check engine AOT pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - name: Fetch pinned engine and translate to C
        run: python3 Scripts/prepare_engine.py
      - name: Create diagnostic host
        run: python3 Scripts/cpu_probe.py Engine/Generated Engine/Generated/imports.json
      - name: Compile native CPU archive
        run: |
          cmake -S Engine -B Engine/Build -G Ninja
          cmake --build Engine/Build -j 3
          ctest --test-dir Engine/Build --output-on-failure
      - name: Probe module instantiation
        run: |
          set +e
          Engine/Build/zone_cpu_probe > Engine/Build/startup.log 2>&1
          result=$?
          cat Engine/Build/startup.log
          if [ "$result" -ne 0 ] && [ "$result" -ne 78 ]; then exit "$result"; fi
          echo "Diagnostic return code: $result. 78 means an unimplemented browser import; this is not a gameplay test."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STALKER-AOT-diagnostics
          path: |
            Engine/Generated/imports.json
            Engine/Build/startup.log
          if-no-files-found: warn
