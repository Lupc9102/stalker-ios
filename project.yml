name: ZonePort
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GCC_C_LANGUAGE_STANDARD: c11
    SWIFT_OBJC_BRIDGING_HEADER: Native/Zone-Bridging-Header.h
    HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/include"]
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ZonePort:
    type: application
    platform: iOS
    sources:
      - App
      - Native
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/ZoneBackdrop.jpg
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: GameController.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lupc9102.zoneport
        PRODUCT_NAME: ZonePort
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ZonePort:
    build:
      targets:
        ZonePort: all
